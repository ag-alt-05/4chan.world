<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shifu Meme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado con gradiente */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(255, 100, 0, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(255, 200, 0, 0.06) 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.1) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%   { transform: scale(1) rotate(0deg); opacity: 0.7; }
      100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    }

    /* Partículas flotantes */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 180, 50, 0.6);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Contenedor de la imagen */
    .hero-container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .hero-title {
      font-family: 'Georgia', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: transparent;
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 140, 0, 0.3);
      margin-bottom: 2rem;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      0%   { filter: brightness(1); }
      100% { filter: brightness(1.3); }
    }

    .image-frame {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 30px rgba(255, 140, 0, 0.3),
        0 0 60px rgba(255, 69, 0, 0.2),
        0 0 100px rgba(255, 140, 0, 0.1),
        inset 0 0 30px rgba(0, 0, 0, 0.5);
      animation: framePulse 4s ease-in-out infinite alternate;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .image-frame:hover {
      transform: scale(1.03) translateY(-5px);
      box-shadow:
        0 0 50px rgba(255, 140, 0, 0.5),
        0 0 100px rgba(255, 69, 0, 0.3),
        0 0 150px rgba(255, 140, 0, 0.2),
        inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    @keyframes framePulse {
      0%   { box-shadow: 0 0 30px rgba(255,140,0,0.3), 0 0 60px rgba(255,69,0,0.2), 0 0 100px rgba(255,140,0,0.1); }
      100% { box-shadow: 0 0 50px rgba(255,140,0,0.5), 0 0 80px rgba(255,69,0,0.3), 0 0 120px rgba(255,140,0,0.2); }
    }

    .image-frame img {
      display: block;
      max-width: 85vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      border-radius: 12px;
    }

    /* Borde animado */
    .image-frame::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      right: -2px; bottom: -2px;
      border-radius: 14px;
      background: conic-gradient(from 0deg, #ffd700, #ff4500, #ffd700, #ff8c00, #ffd700);
      z-index: -1;
      animation: borderRotate 4s linear infinite;
    }

    @keyframes borderRotate {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* Subtítulo */
    .hero-sub {
      margin-top: 2rem;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      color: rgba(255, 200, 150, 0.6);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      animation: subFade 3s ease-in-out infinite alternate;
    }

    @keyframes subFade {
      0%   { opacity: 0.4; }
      100% { opacity: 0.8; }
    }

    /* Línea decorativa */
    .divider {
      width: 200px;
      height: 2px;
      margin: 1rem auto;
      background: linear-gradient(90deg, transparent, #ff8c00, transparent);
    }
  </style>
</head>
<body>

  <!-- Partículas -->
  <div class="particles" id="particles"></div>

  <div class="hero-container">
    <h1 class="hero-title">Shifu</h1>
    <div class="divider"></div>
    <div class="image-frame">
      <img src="image/shifu.png" alt="Shifu Meme">
    </div>
    <div class="divider"></div>
    <p class="hero-sub"></p>
  </div>

  <script>
    // Generar partículas
    const container = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      container.appendChild(p);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
